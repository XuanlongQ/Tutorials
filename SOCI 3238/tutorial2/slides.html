<h1 id="part-i--statistical-models">Part I · Statistical Models</h1>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="from-description-to-inference">From description to inference</h2>
<p><strong>Descriptive statistics</strong> — what does my data look like?</p>
<ul>
<li><code>mean()</code>, <code>median()</code>, <code>summary()</code>, plots (Tutorial 1)</li>
</ul>
<p><strong>Inferential statistics</strong> — is the pattern real? What explains it?</p>
<ul>
<li>Hypothesis testing: is this difference / association real?</li>
<li>Modeling: how does x relate to y?</li>
</ul>
<blockquote>
<p>Both answer: &quot;can I trust this pattern beyond my sample?&quot;</p>
</blockquote>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="hypothesis-testing-1">Hypothesis testing (1)</h2>
<p>A formal way to decide whether an observed pattern is &quot;real&quot;</p>
<ul>
<li><strong>Null hypothesis (H0)</strong>: nothing is going on (no difference, no association)</li>
<li><strong>Alternative hypothesis (H1)</strong>: something is going on</li>
<li><strong>p-value</strong>: probability of seeing data like this <em>if H0 is true</em></li>
<li>Convention: p &lt; 0.05 → reject H0 (&quot;statistically significant&quot;)</li>
</ul>
<blockquote>
<p>p &lt; 0.05 means &quot;H0 looks unlikely&quot;, not &quot;my theory is proven&quot;</p>
</blockquote>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="hypothesis-testing-2-t-test">Hypothesis testing (2): t-test</h2>
<p>Compare the means of two groups</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">t.test<span class="hljs-punctuation">(</span>mpg <span class="hljs-operator">~</span> am<span class="hljs-punctuation">,</span> data <span class="hljs-operator">=</span> mtcars<span class="hljs-punctuation">)</span>
</code></pre>
<ul>
<li><code>am</code> = 0 (automatic) vs 1 (manual): is fuel efficiency different?</li>
<li>Read the output: group means, t statistic, df, <strong>p-value</strong></li>
</ul>
<p>Digital sociology example: do verified accounts get more likes on average?</p>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="hypothesis-testing-3-chi-square-test">Hypothesis testing (3): chi-square test</h2>
<p>Test the association between two categorical variables</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">tbl <span class="hljs-operator">&lt;-</span> table<span class="hljs-punctuation">(</span>mtcars<span class="hljs-operator">$</span>cyl<span class="hljs-punctuation">,</span> mtcars<span class="hljs-operator">$</span>am<span class="hljs-punctuation">)</span>
chisq.test<span class="hljs-punctuation">(</span>tbl<span class="hljs-punctuation">)</span>
</code></pre>
<ul>
<li>H0: no association; p &lt; 0.05 → associated</li>
<li>Digital sociology example: is gender associated with platform choice?</li>
</ul>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="linear-regression-1">Linear regression (1)</h2>
<p>Model how a numeric outcome depends on predictors</p>
<ul>
<li>Fit the line that best describes y ~ x</li>
<li>y = a + b·x + error</li>
<li><code>lm(y ~ x, data = ...)</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">model <span class="hljs-operator">&lt;-</span> lm<span class="hljs-punctuation">(</span>mpg <span class="hljs-operator">~</span> wt<span class="hljs-punctuation">,</span> data <span class="hljs-operator">=</span> mtcars<span class="hljs-punctuation">)</span>
summary<span class="hljs-punctuation">(</span>model<span class="hljs-punctuation">)</span>
</code></pre>
<p>(This is the line we drew in Tutorial 1's hands-on with <code>abline()</code>)</p>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="linear-regression-2-reading-the-output">Linear regression (2): reading the output</h2>
<ul>
<li><strong>Estimate (b)</strong>: a one-unit increase in x → b change in y</li>
<li><strong>Pr(&gt;|t|)</strong>: is b significantly different from 0?</li>
<li><strong>R²</strong>: share of variation in y explained by the model (0–1)</li>
</ul>
<p>Interpretation template:</p>
<blockquote>
<p>&quot;A 1,000 lbs heavier car is associated with 5.3 mpg lower fuel efficiency (p &lt; .001)&quot;</p>
</blockquote>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="linear-regression-3-multiple-predictors">Linear regression (3): multiple predictors</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">model2 <span class="hljs-operator">&lt;-</span> lm<span class="hljs-punctuation">(</span>mpg <span class="hljs-operator">~</span> wt <span class="hljs-operator">+</span> hp<span class="hljs-punctuation">,</span> data <span class="hljs-operator">=</span> mtcars<span class="hljs-punctuation">)</span>
</code></pre>
<ul>
<li>Now b means &quot;holding the other variables constant&quot;</li>
<li>Categorical predictors → make them factors first (Tutorial 1!)</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">model3 <span class="hljs-operator">&lt;-</span> lm<span class="hljs-punctuation">(</span>mpg <span class="hljs-operator">~</span> wt <span class="hljs-operator">+</span> factor<span class="hljs-punctuation">(</span>cyl<span class="hljs-punctuation">)</span><span class="hljs-punctuation">,</span> data <span class="hljs-operator">=</span> mtcars<span class="hljs-punctuation">)</span>
</code></pre>
<ul>
<li>Model comparison: does adding a variable help? (R², AIC)</li>
</ul>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="logistic-regression-1">Logistic regression (1)</h2>
<p>When the outcome is <strong>binary</strong> (0/1, yes/no)</p>
<ul>
<li>Digital sociology: retweet or not? follow back or not? purchase or not?</li>
<li>Why not <code>lm()</code>? → predicted values can go outside [0, 1]</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">model4 <span class="hljs-operator">&lt;-</span> glm<span class="hljs-punctuation">(</span>am <span class="hljs-operator">~</span> wt <span class="hljs-operator">+</span> hp<span class="hljs-punctuation">,</span> data <span class="hljs-operator">=</span> mtcars<span class="hljs-punctuation">,</span> family <span class="hljs-operator">=</span> binomial<span class="hljs-punctuation">)</span>
summary<span class="hljs-punctuation">(</span>model4<span class="hljs-punctuation">)</span>
</code></pre>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="logistic-regression-2-interpretation">Logistic regression (2): interpretation</h2>
<ul>
<li>Output is in <strong>log-odds</strong> — hard to interpret directly</li>
<li>Convert to <strong>odds ratios</strong>:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r"><span class="hljs-built_in">exp</span><span class="hljs-punctuation">(</span>coef<span class="hljs-punctuation">(</span>model4<span class="hljs-punctuation">)</span><span class="hljs-punctuation">)</span>
</code></pre>
<ul>
<li>OR = 2 → the odds double per one-unit increase in x</li>
<li>OR &lt; 1 → negative association; OR &gt; 1 → positive association</li>
</ul>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="which-model-when">Which model when?</h2>
<table>
<thead>
<tr>
<th>Your question</th>
<th>Test / model</th>
</tr>
</thead>
<tbody>
<tr>
<td>Are two group means different?</td>
<td>t-test</td>
</tr>
<tr>
<td>Are two categorical variables associated?</td>
<td>chi-square</td>
</tr>
<tr>
<td>What predicts a numeric outcome?</td>
<td>linear regression <code>lm()</code></td>
</tr>
<tr>
<td>What predicts a binary outcome?</td>
<td>logistic regression <code>glm()</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Rule of thumb: look at the outcome variable first</p>
</blockquote>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h1 id="part-ii--network-analysis">Part II · Network Analysis</h1>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="why-networks">Why networks?</h2>
<p>Digital sociology studies <strong>relations</strong>, not only attributes</p>
<ul>
<li>Follows on Weibo/Twitter, retweets, replies, friendships</li>
<li>Networks = individuals (<strong>nodes</strong>) + ties (<strong>edges</strong>)</li>
</ul>
<p>Attribute view: who is this person? (age, gender, likes)<br />
Network view: who is connected to whom? (position, influence, community)</p>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="graph-basics">Graph basics</h2>
<ul>
<li><strong>Nodes</strong> (vertices) — people, accounts, organizations</li>
<li><strong>Edges</strong> — ties between them</li>
<li><strong>Directed</strong> — A follows B ≠ B follows A</li>
<li><strong>Undirected</strong> — friendship: mutual</li>
<li><strong>Weighted</strong> — number of messages, strength of tie</li>
</ul>
<p>Data format: <strong>edge list</strong> — a table with two columns: from, to</p>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="igraph-build--plot">igraph: build &amp; plot</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">library<span class="hljs-punctuation">(</span>igraph<span class="hljs-punctuation">)</span>

g <span class="hljs-operator">&lt;-</span> graph_from_data_frame<span class="hljs-punctuation">(</span>edges<span class="hljs-punctuation">,</span> directed <span class="hljs-operator">=</span> <span class="hljs-literal">TRUE</span><span class="hljs-punctuation">)</span>
plot<span class="hljs-punctuation">(</span>g<span class="hljs-punctuation">)</span>
</code></pre>
<ul>
<li><code>V(g)</code> — nodes, <code>E(g)</code> — edges</li>
<li>Add attributes: <code>V(g)$name</code>, <code>V(g)$group</code></li>
</ul>
<p>Classic example built into igraph: <strong>Zachary's karate club</strong> (1977)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">make_graph<span class="hljs-punctuation">(</span><span class="hljs-string">&quot;Zachary&quot;</span><span class="hljs-punctuation">)</span>
</code></pre>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="network-measures-1-degree--density">Network measures (1): degree &amp; density</h2>
<ul>
<li><strong>Degree</strong> — how many ties a node has
<ul>
<li>in-degree: followers; out-degree: following</li>
<li>Digital sociology: the influencer = high in-degree</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">degree<span class="hljs-punctuation">(</span>g<span class="hljs-punctuation">,</span> mode <span class="hljs-operator">=</span> <span class="hljs-string">&quot;in&quot;</span><span class="hljs-punctuation">)</span>
</code></pre>
<ul>
<li><strong>Density</strong> — how connected the network is overall</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">edge_density<span class="hljs-punctuation">(</span>g<span class="hljs-punctuation">)</span>
</code></pre>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="network-measures-2-centrality">Network measures (2): centrality</h2>
<p>Who is &quot;important&quot; in the network?</p>
<ul>
<li><strong>Degree centrality</strong> — most ties (popular, active)</li>
<li><strong>Betweenness centrality</strong> — on many shortest paths (bridges, gatekeepers)</li>
<li><strong>Closeness centrality</strong> — close to everyone else (information spreads fast)</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">betweenness<span class="hljs-punctuation">(</span>g<span class="hljs-punctuation">)</span>
closeness<span class="hljs-punctuation">(</span>g<span class="hljs-punctuation">)</span>
</code></pre>
<blockquote>
<p>Different measures → different kinds of importance</p>
</blockquote>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="community-detection">Community detection</h2>
<p>Find groups that are densely connected within, sparsely between</p>
<ul>
<li>The karate club: members split into two clubs — can the algorithm find it?</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-r">cm <span class="hljs-operator">&lt;-</span> cluster_fast_greedy<span class="hljs-punctuation">(</span>g<span class="hljs-punctuation">)</span>
membership<span class="hljs-punctuation">(</span>cm<span class="hljs-punctuation">)</span>
plot<span class="hljs-punctuation">(</span>cm<span class="hljs-punctuation">,</span> g<span class="hljs-punctuation">)</span>
</code></pre>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="a-social-media-example">A social media example</h2>
<ul>
<li>Edge list of user accounts: <code>user_id</code> follows <code>followee_id</code></li>
<li>Find the influencers (top in-degree)</li>
<li>Visualize the community structure</li>
</ul>
<p><code>igraph</code> works the same way for 34 karate members and 34 million users</p>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h1 id="hands-on">Hands-on</h1>
<p>Part A · Statistical models (10 min)<br />
Part B · Network analysis (10 min)</p>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="hands-on-a-statistical-models">Hands-on A: Statistical models</h2>
<p>Dataset: <code>mtcars</code> (continuation of Tutorial 1)</p>
<ol>
<li><strong>t-test</strong> — does fuel efficiency differ between automatic and manual cars?</li>
<li><strong>Linear regression</strong> — model <code>mpg</code> with <code>wt + hp</code>; interpret coefficients and R²</li>
<li><strong>Logistic regression</strong> — model <code>am</code> (automatic = 0, manual = 1); compute odds ratios</li>
</ol>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-theme="cuhk" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="hands-on-b-network-analysis">Hands-on B: Network analysis</h2>
<ol>
<li><strong>Build</strong> the karate club network, <strong>plot</strong> it</li>
<li>Compute <strong>degree &amp; betweenness</strong> — who are the top-3 most central?</li>
<li>Run <strong>community detection</strong> — compare with the real split</li>
<li>Load a small <strong>social media edge list</strong> (<code>data/social_edges.csv</code>) — find the top influencers and plot</li>
</ol>
<footer>SOCI 3238 · Digital Sociology · Tutorial 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="SOCI 3238 · Digital Sociology · Tutorial 2" data-class="lead" data-theme="cuhk" lang="en-US" class="lead" data-marpit-pagination="26" style="--paginate:true;--footer:SOCI 3238 · Digital Sociology · Tutorial 2;--class:lead;--theme:cuhk;" data-marpit-pagination-total="26" data-size="16:9">
